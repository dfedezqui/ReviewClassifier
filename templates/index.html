<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Reseñas IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Haz una reseña</h1>
        <p class="subtitle">Mi IA te dirá algo bonico (o no).</p>
        
        <form id="resenaForm">
            <textarea id="resenaInput" placeholder="Escribe aquí tu opinión..." required></textarea>
            <button type="submit" id="submitBtn">Enviar mi opinión</button>
        </form>

        <div id="resultado-container"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
